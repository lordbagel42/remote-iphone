# XcodeGen spec for ScreenStream: an app whose Broadcast Upload extension streams the phone's whole
# screen as hardware-encoded H.264 on TCP port 8400. Build with vm/build-screenstream-ipa.sh.
name: ScreenStream
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ScreenStream:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: Broadcast
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ScreenStream
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Streams this phone's screen to the computer that controls it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raygen.ScreenStream
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: ScreenStream
        NSLocalNetworkUsageDescription: Streams this phone's screen to the computer that controls it.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.raygen.ScreenStream.Broadcast
